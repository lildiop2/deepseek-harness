services:
  deepseek-harness:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: latest

    image: deepseek-harness:latest

    container_name: deepseek-harness

    restart: unless-stopped

    ports:
      - "3080:8080"

    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      DSH_TELEMETRY_DISABLED: "1"

    volumes:
      - dsh-home:/home/node/.dsh
      - ./workspace:/workspace

    security_opt:
      - no-new-privileges:true

volumes:
  dsh-home: